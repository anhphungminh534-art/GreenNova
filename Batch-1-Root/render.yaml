services:
  - type: web
    name: greennova-store
    runtime: node
    buildCommand: npm ci --prefix server_back && npm ci --prefix client_front && npm run build --prefix client_front
    startCommand: npm start --prefix server_back
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: greennova
      - key: JWT_SECRET
        generateValue: true
